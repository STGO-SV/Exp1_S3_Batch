spring.application.name=banco-legacy-anomaly-service

spring.datasource.url=${ANOMALY_DB_URL:jdbc:postgresql://localhost:5432/banco_legacy}
spring.datasource.username=${ANOMALY_DB_USERNAME:postgres}
spring.datasource.password=${ANOMALY_DB_PASSWORD:${DB_PASSWORD:postgres}}
spring.sql.init.mode=always

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=banco-legacy-anomaly-processors
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.duoc.banco_legacy.core.event.AnomalousTransactionEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.duoc.banco_legacy.core.event
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=${ANOMALY_CONCURRENCY:1}

banking.kafka.anomaly-topic=banco.transacciones.anomalas.v1
banking.kafka.anomaly-dlt-topic=banco.transacciones.anomalas.v1.DLT
banking.kafka.consumer-instance=${ANOMALY_CONSUMER_INSTANCE:${HOSTNAME:${random.uuid}}}

management.endpoints.web.exposure.include=health,info
