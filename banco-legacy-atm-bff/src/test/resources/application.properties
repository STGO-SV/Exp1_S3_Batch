spring.datasource.url=jdbc:h2:mem:atm_bff;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=never
# Sólo tests internos: TLS se verifica por separado con los procesos reales.
server.ssl.enabled=false
spring.config.import=optional:configserver:http://127.0.0.1:65535
spring.cloud.config.enabled=false
eureka.client.enabled=false
banking.account-service-name=banco-legacy-account-service
banking.http.connect-timeout=100ms
banking.http.read-timeout=100ms
security.jwt.issuer=test-issuer
security.jwt.audience=test-audience
