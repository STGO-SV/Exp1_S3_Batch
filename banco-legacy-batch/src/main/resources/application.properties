spring.application.name=banco-legacy-batch
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banco_legacy_batch}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.sql.init.mode=always

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=3000
banking.kafka.anomaly-topic=banco.transacciones.anomalas.v1
banking.kafka.enabled=${BANKING_KAFKA_ENABLED:true}
banking.kafka.outbox.fixed-delay=2000
banking.kafka.publish-retries=3
banking.kafka.publish-backoff=1000

batch.input-directory=${BATCH_INPUT_DIR:C:/Dev/Duoc/DBE3/bank_legacy_data/data/semana_3}
batch.run-on-startup=${BATCH_RUN_ON_STARTUP:true}
batch.partition.grid-size=${BATCH_GRID_SIZE:4}
batch.partition.thread-count=${BATCH_THREAD_COUNT:4}
batch.chunk-size=${BATCH_CHUNK_SIZE:100}
batch.skip-limit=${BATCH_SKIP_LIMIT:1000}
