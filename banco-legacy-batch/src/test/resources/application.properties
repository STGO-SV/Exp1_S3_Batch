spring.application.name=banco-legacy-batch
spring.datasource.url=jdbc:h2:mem:banco_batch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.sql.init.mode=always
banking.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=3000
batch.input-directory=${batch.test-data-root:${BATCH_TEST_DATA_ROOT:../../bank_legacy_data/data}}/semana_1
batch.run-on-startup=false
batch.partition.grid-size=4
batch.partition.thread-count=4
batch.chunk-size=10
batch.skip-limit=10
