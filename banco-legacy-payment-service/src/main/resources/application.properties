spring.application.name=banco-legacy-payment-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
security.jwt.public-key=${JWT_PUBLIC_KEY}
server.ssl.key-store=${SERVER_SSL_KEY_STORE}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
banking.kafka.financial-topic=banco.operaciones.completadas.v1

spring.datasource.password=${DB_PASSWORD}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.duoc.banco_legacy.core.event.FinancialOperationCompletedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.duoc.banco_legacy.core.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
