spring.application.name=banco-legacy-payment-service
spring.cloud.config.enabled=false
spring.config.import=
eureka.client.enabled=false
server.ssl.enabled=false
management.endpoints.web.exposure.include=health,info
banking.kafka.enabled=false
spring.datasource.url=jdbc:h2:mem:payment_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-eft-payment.sql
