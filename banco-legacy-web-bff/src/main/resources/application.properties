spring.application.name=banco-legacy-web-bff
server.port=${WEB_BFF_PORT:8081}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.datasource.hikari.read-only=true
security.jwt.public-key=${JWT_PUBLIC_KEY}
security.jwt.issuer=${JWT_ISSUER:banco-legacy-auth}
security.jwt.audience=${JWT_AUDIENCE:banco-bff}
# TLS directo; PKCS12 local generado con el procedimiento del profesor.
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-local
