server:
  port: ${ACCOUNT_SERVICE_PORT:8085}
  ssl:
    enabled: true
    key-store-type: PKCS12
    key-alias: bff-local

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    driver-class-name: org.postgresql.Driver
    hikari:
      read-only: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-eft-account.sql

eureka:
  instance:
    hostname: localhost
    secure-port-enabled: true
    non-secure-port-enabled: false
    secure-port: ${ACCOUNT_SERVICE_PORT:8085}
    status-page-url: https://localhost:${ACCOUNT_SERVICE_PORT:8085}/actuator/info
    health-check-url: https://localhost:${ACCOUNT_SERVICE_PORT:8085}/actuator/health

banking:
  limits:
    mobile-movements: 5
    web-movements: 20
    web-anomalies: 10
    atm-movements: 3

resilience4j:
  circuitbreaker:
    instances:
      customerRegistry:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException