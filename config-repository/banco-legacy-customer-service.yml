server:
  port: 8087
  ssl:
    enabled: true
    key-store-type: PKCS12
    key-alias: bff-local
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
    secure-port-enabled: true
    non-secure-port-enabled: false
    secure-port: 8087
management:
  endpoints:
    web:
      exposure:
        include: health,info