# Optional EFT scaffolding. Existing Semana 8 Compose stays unchanged.
x-eft-service: &eft-service
  profiles: [eft]
  restart: unless-stopped
  networks: [banco-network]
  volumes:
    - ./.local/compose:/run/banco-legacy:ro
  depends_on:
    config-server: {condition: service_healthy}
    discovery-server: {condition: service_healthy}
x-eft-environment: &eft-environment
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Ejecute scripts/initialize-compose-environment.ps1}
  OAUTH_ISSUER: https://localhost:8084
  JWT_AUDIENCE: banco-bff
  SERVER_ADDRESS: 0.0.0.0
  SERVER_SSL_KEY_STORE: file:/run/banco-legacy/banco-legacy-docker.p12
  TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:?Ejecute scripts/initialize-compose-environment.ps1}

services:
  payment-service:
    <<: *eft-service
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: {MODULE: banco-legacy-payment-service}
    image: banco-legacy/payment-service:eft
    environment:
      <<: *eft-environment
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: payment-service
      EUREKA_INSTANCE_STATUS_PAGE_URL: https://payment-service:8086/actuator/info
      EUREKA_INSTANCE_HEALTH_CHECK_URL: https://payment-service:8086/actuator/health
    expose: ["8086"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--insecure", "https://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
  customer-service:
    <<: *eft-service
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: {MODULE: banco-legacy-customer-service}
    image: banco-legacy/customer-service:eft
    environment:
      <<: *eft-environment
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: customer-service
      EUREKA_INSTANCE_STATUS_PAGE_URL: https://customer-service:8087/actuator/info
      EUREKA_INSTANCE_HEALTH_CHECK_URL: https://customer-service:8087/actuator/health
    expose: ["8087"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--insecure", "https://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s